name: niskala
description: "Darkness Dungeon RPG Game - ported to Bonfire 4."
publish_to: 'none'

version: 1.3.6+11

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  bonfire: ^4.0.0
  flame: ^1.38.0
  flame_audio: ^2.10.2
  flame_splash_screen: ^0.3.1
  url_launcher: ^6.3.1
  flutter_secure_storage: ^11.2.0
  cryptography: ^2.9.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/images/emote/
    - assets/images/npc/
    - assets/images/enemy/
    - assets/images/enemy/goblin/
    - assets/images/enemy/imp/
    - assets/images/enemy/mini_boss/
    - assets/images/enemy/boss/
    - assets/images/player/
    - assets/images/player/arka/idle/
    - assets/images/player/arka/run/
    - assets/images/player/arka/attack_1/
    - assets/images/player/arka/attack_2/
    - assets/images/items/
    - assets/images/tiled/
    - assets/audio/
    - resources/lang/en.json
    - resources/lang/pt.json

  fonts:
   - family: Normal
     fonts:
       - asset: fonts/font_pixel.ttf
